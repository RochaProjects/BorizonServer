name: checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: server-plugins

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Check dedicated server engine
        run: cargo +stable clippy --locked -p horizon-client --bin horizon-client --no-default-features --features server-plugins,dedicated-server -- -D warnings

      - name: Check server tools and plugin SDK
        run: cargo +stable clippy --locked -p horizon-server -p horizon-prepare -p horizon-server-plugin-api -p horizon-server-plugin-loader --all-targets -- -D warnings

      - name: Test plugin SDK and loader
        run: cargo +stable test --locked -p horizon-server-plugin-api -p horizon-server-plugin-loader --all-targets
