# This publishes the Borizon server runtime bundle. It does not build or publish an AuraEssentials .so.
name: Borizon server release

on:
  # This is a rolling development release. Dispatch it from the tested branch/ref;
  # it refreshes the same release and moves its tag after the assets are uploaded.
  workflow_dispatch:
    inputs:
      source_ref:
        description: Tested branch, tag, or commit to package
        required: true
        default: main
        type: string
      tag:
        description: The single moving Borizon server tag
        required: true
        default: aura-v0.1.16
        type: string

permissions:
  contents: write

concurrency:
  group: borizon-server-release
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Pin the checked out fork commit
        run: echo "HORIZON_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-1.99-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rust-1.99-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-server-plugin-rust-1.99-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-rust-1.99-
          save-always: true

      - name: Build server engine, server supervisor, and resource preparer
        run: |
          set -euo pipefail
          # Keep all three files in the release bundle. Cargo's fingerprints and
          # restored target cache rebuild only crates/binaries affected by source,
          # dependency, toolchain, or feature changes.
          cargo build --locked --release -p horizon-client --no-default-features --features server-plugins,dedicated-server --bin horizon-client
          cargo build --locked --release -p horizon-server -p horizon-prepare
          mkdir -p dist/borizon-server
          cp target/release/horizon-server dist/borizon-server/
          cp target/release/horizon-prepare dist/borizon-server/
          cp target/release/horizon-client dist/borizon-server/horizon-engine
          cp research-lock.json LICENSE dist/borizon-server/
          chmod +x dist/borizon-server/horizon-server dist/borizon-server/horizon-prepare dist/borizon-server/horizon-engine
          # Keep the manifest/asset filenames expected by already-deployed loader.jar versions.
          printf '{"engine":"vanilla-horizon","plugin_abi":3,"horizon":"%s","minecraft":"26.3"}\n' "$HORIZON_REVISION" > dist/borizon-server/auraessentials-release.json
          tar -czf dist/aura-essentials-server-linux-x86_64.tar.gz -C dist borizon-server
          sha256sum dist/aura-essentials-server-linux-x86_64.tar.gz > dist/aura-essentials-server-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          [[ "$tag" =~ ^aura-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="Build de desenvolvimento do Borizon Server para Minecraft 26.3. Commit: ${HORIZON_REVISION}. Linux x86_64; inclui horizon-server, horizon-engine e horizon-prepare com host de plugins C ABI v3. O pacote não contém plugins .so. Esta release é atualizada no mesmo tag para testes da host."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/aura-essentials-server-linux-x86_64.tar.gz \
              dist/aura-essentials-server-linux-x86_64.tar.gz.sha256
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Borizon Server dev · ${HORIZON_REVISION:0:12}" \
              --notes "$notes" \
              --latest
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$HORIZON_REVISION" \
              --title "Borizon Server dev · ${HORIZON_REVISION:0:12}" \
              --notes "$notes" \
              --latest \
              dist/aura-essentials-server-linux-x86_64.tar.gz \
              dist/aura-essentials-server-linux-x86_64.tar.gz.sha256
          fi

          # Keep the release tag pointed at the exact source used for this bundle.
          git tag --force "$tag" "$HORIZON_REVISION"
          git push --force origin "refs/tags/$tag"
