[workspace]
members = ["crates/horizon-core", "crates/horizon-world", "crates/horizon-protocol", "crates/horizon-server-files", "crates/horizon-engine"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
