[package]
name = "horizon-shader-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon's own shader packs (WGSL, docs/shaders.md): the format, the stages, the check, and the horizon-shader tool"

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
# Parses and validates a pack's WGSL, and translates it as wgpu does for Vulkan, Metal and DirectX 12.
png = "0.18"
naga = { version = "30.0.1", features = ["wgsl-in"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.6"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[features]
# Full client/tools validation checks every WGSL stage against the actual GPU
# backends. The headless server only needs the pack manifest/data types and
# WGSL parsing; it does not run or compile these visual shaders.
default = ["shader-backends"]
shader-backends = ["naga/spv-out", "naga/msl-out", "naga/hlsl-out"]
