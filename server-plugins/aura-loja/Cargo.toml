[package]
name = "horizon-plugin-aura-loja"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Loja GUI em português para servidores Horizon"

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-server-plugin-api = { path = "../api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30.10"
sha1 = "0.10"
ureq = "2.12.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
url = "2.5"
